<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400&family=JetBrains+Mono&display=swap" rel="stylesheet">

  <style>
    /* Reset default browser spacing */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 300 !important; 
      background-color: #0d1117 !important; 
      color: #c9d1d9 !important;            
      letter-spacing: 0.01em; 
      line-height: 1.6;
    }

    /* This wrapper adapts perfectly to desktop width OR small mobile screens */
    .page-wrapper {
      width: 100%;
      max-width: 900px;         /* Max size on desktop */
      margin: 0 auto;           /* Centers the entire page content */
      padding: 2rem 1.5rem;     /* 1.5rem padding gives side margins on mobile so text doesn't touch the screen edge */
      text-align: center;
    }
    
    h1 {
      font-weight: 200 !important; 
      color: #f0f6fc !important;            
      letter-spacing: -0.02em; 
      margin-bottom: 1.5rem !important;
    }

    p {
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    /* Hide the automatic hover link icons next to headings */
    .anchor { display: none !important; }

    /* Responsive Video Container */
    .video-container {
      width: 100%;
      max-width: 750px; 
      margin: 0 auto;   
    }

    .video-container iframe {
      width: 100% !important;  
      height: auto !important;
      aspect-ratio: 16 / 9;    
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  
<h1 style="text-align: center;">Portfolio: gng</h1>

<h2 style="text-align: center;">Poly Otter</h2>

<div class="video-container">
  <iframe 
    src="https://www.youtube.com/embed/gSVaykTc9rY" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
    allowfullscreen>
  </iframe>
</div>

<div style="text-align: center;">
An isometric sea otter adventure
</div>
</body>
</html>
